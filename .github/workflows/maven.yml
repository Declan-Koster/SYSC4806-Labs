name: Maven CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  build:
    runs-on:
      ubuntu-latest

    steps:
      - name: Check Repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: mvn --batch-mode verify