<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Address Book</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>

<h1>Address Book</h1>
<ul>
    <li th:each="friend : ${addressBook.friends}"
        th:text="${friend.name + ' - ' + friend.number}">
    </li>
</ul>
</body>
</html>
