<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Address Book</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>

<h1>Address Book</h1>

<h2>Current Buddies</h2>
<table border="1">
    <thead>
    <tr>
        <th>Name</th>
        <th>Phone Number</th>
        <th>Address</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="friend : ${addressBook.friends}">
        <td th:text="${friend.name}"></td>
        <td th:text="${friend.number}"></td>
        <td th:text="${friend.address}"></td>
    </tr>
    </tbody>
</table>

<h2>Add a Buddy</h2>

<form th:action="@{/addressBooks/{id}/friends(id=${addressBook.id})}" method="post">

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required/>
    <br><br>

    <label for="number">Phone Number:</label>
    <input type="text" id="number" name="number" required />
    <br><br>

    <label for="address">Address:</label>
    <input type="text" id="address" name="address" />
    <br><br>

    <button type="submit">Add Buddy</button>
</form>

<br>
<a th:href="@{/}">Address Books</a>

</body>
</html>
