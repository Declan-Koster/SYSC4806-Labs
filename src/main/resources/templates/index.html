<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Address Books</title>
</head>
<body>
<h1>Address Books</h1>

<form th:action="@{/addressBooks/create}" method="post">
    <button type="submit">Create Address Book </button>
</form>

<h2>Existing Address Books</h2>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody>
    <tr th:each="book: ${addressBooks}">
        <td th:text="${book.id}"></td>
        <td>
            <a th:href="@{/addressBooks/{id}/view(id=${book.id})}">
                view Buddies
            </a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
